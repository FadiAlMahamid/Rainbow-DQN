# ===================================================================
# Rainbow DQN Configuration
# Combines: Double DQN, Dueling, NoisyNets, C51, N-Step, PER
# ===================================================================

# --- Atari Environment Settings ---
environment:
  # The Gymnasium environment ID. "NoFrameskip" variant is required
  # so that AtariPreprocessing can handle frame skipping consistently.
  name: "BreakoutNoFrameskip-v4"

# --- Reproducibility ---
# Random seed for NumPy, PyTorch, and the environment.
# Set to a fixed value for reproducible results.
seed: 42

# --- Training Loop Settings ---
training:
  # Total number of agent steps to train for.
  # Each step = 1 action taken = 4 raw frames (due to frame skip).
  # DeepMind 2015 used 12.5M steps (50M frames). 2.5M is a good
  # balance between training time and performance.
  num_steps: 2500000

  # Average reward (over plot_window episodes) that triggers early stopping.
  target_reward: 40

  # How often (in steps) to print progress to the console.
  print_every: 10000

  # How often (in steps) to save a checkpoint of the model and history.
  # Set to 0 to disable periodic checkpointing (only saves at the end).
  checkpoint_every: 100000

  # Window size for computing the moving average of rewards in logs and plots.
  # Also used for early stopping checks. Higher values = smoother curves.
  plot_window: 500

  # Number of episodes to run during deployment visualization.
  deploy_trials: 5

  # Execution mode:
  #   "new"    - Train from scratch
  #   "resume" - Load saved model and history, then continue training
  #   "deploy" - Load saved model and visualize the agent playing
  mode: "new"

# --- Agent Hyperparameters ---
agent:
  # Optimizer for updating network weights.
  #   "adam"    - Adam; adaptive learning rates per parameter (recommended)
  #   "rmsprop" - RMSprop; used in the original DeepMind DQN paper
  optimizer: "adam"

  # Learning rate for the optimizer.
  # Rainbow paper used 0.0000625 (6.25e-5), lower than standard DQN
  # because the distributional loss and PER provide stronger gradients.
  learning_rate: 0.0000625

  # Discount factor for future rewards in the Bellman equation.
  gamma: 0.99

  # Maximum norm for gradient clipping (applied per training step).
  # Rainbow uses a higher clip norm (10.0) than standard DQN (1.0) because
  # the cross-entropy loss over distributions produces different gradient scales.
  grad_clip_norm: 10.0

  # Whether to clip rewards to the range [-1, 1].
  # Normalizes the learning signal so that large rewards don't produce
  # outsized gradients. Standard practice from the DeepMind 2015 paper.
  clip_rewards: true

  # Initial noise scale for NoisyLinear layers (Fortunato et al., 2018).
  # Higher values = more initial exploration. 0.5 is the paper default
  # for factorised Gaussian noise. The sigma parameters are learned via
  # gradient descent and shrink as the agent learns.
  sigma_init: 0.5

# --- C51 Distributional Parameters ---
# Controls the categorical distribution over returns.
# Reference: Bellemare, Dabney, Munos (2017)
c51:
  # Number of atoms in the categorical distribution.
  # More atoms = finer resolution. 51 is the original paper default.
  num_atoms: 51

  # Range of the support [v_min, v_max].
  # With clipped rewards in [-1, 1] and gamma=0.99, theoretical returns
  # span [-100, +100], but [-10, 10] works well in practice for Breakout
  # where episodes are short enough that cumulative returns stay in range.
  v_min: -10.0
  v_max: 10.0

# --- N-Step Returns ---
# Controls multi-step bootstrapping for faster credit assignment.
# Reference: Sutton (1988)
n_step:
  # Number of steps to accumulate before bootstrapping.
  # n=3 provides a good balance between bias and variance.
  # Higher n = faster propagation of rewards but more variance.
  n: 3

# --- Experience Replay Buffer ---
# Stores past transitions for priority-based sampling.
replay_buffer:
  # Maximum number of transitions stored. Older transitions are
  # discarded when full (FIFO). DeepMind 2015 used 1M.
  capacity: 1000000

  # Number of transitions sampled per training step.
  batch_size: 32

  # Minimum number of transitions in the buffer before learning begins.
  # During this warmup phase the agent only explores (collects data).
  # Ensures the first mini-batches are diverse rather than heavily correlated.
  learning_starts: 50000

# --- Prioritized Experience Replay (PER) ---
# Controls how aggressively transitions are prioritized by TD error
# and how the resulting sampling bias is corrected via Importance Sampling.
# Reference: Schaul et al. (2016)
prioritized_replay:
  # Prioritization exponent. Controls how much priority affects sampling.
  #   alpha = 0: uniform sampling (equivalent to standard ER)
  #   alpha = 1: full prioritization (sample strictly by TD error)
  # 0.6 is the value used in the original PER paper.
  alpha: 0.6

  # Initial value of beta for Importance Sampling (IS) correction.
  # Low beta early on allows aggressive prioritization (acceptable bias
  # when the policy is still random). Annealed linearly to 1.0.
  beta_start: 0.4

  # Number of steps over which beta is annealed from beta_start to 1.0.
  # Should match or exceed total training steps to ensure full bias
  # correction by the end of training (needed for convergence guarantees).
  beta_frames: 2500000

  # Small constant added to |TD error| before raising to alpha.
  # Ensures every transition has a non-zero probability of being sampled,
  # even if its TD error is exactly zero.
  priority_epsilon: 0.00001

# --- Target Network ---
# A frozen copy of the policy network used to compute stable TD targets.
# Periodically updated by copying weights from the policy network.
target_network:
  # How often (in learning steps) to copy policy network weights to target network.
  # Rainbow paper used 8000 steps (vs 10000 for standard DQN).
  update_freq: 8000

# --- File Paths ---
paths:
  # Directory where all training outputs are saved.
  results_dir: "rainbow_results"

  # Filename for the saved model weights (.pth).
  model_filename: "rainbow_model.pth"

  # Filename for the training history (rewards, losses, step count).
  history_filename: "training_history.npz"

  # Filename for the training progress plot image.
  plot_filename: "training_plots.png"
